name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include expected and actual behavior. Do not include private artwork or secrets.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: FrameVault version, OS, Node.js version
    validations:
      required: true
